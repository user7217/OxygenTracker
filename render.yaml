services:
  - type: web
    name: oxygen-cylinder-tracker
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 main:app"
    plan: starter
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: oxygen-tracker-db
          property: connectionString

databases:
  - name: oxygen-tracker-db
    databaseName: oxygen_tracker
    user: oxygen_user
    plan: starter